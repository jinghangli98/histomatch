[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "histomatch"
version = "0.1.0"
description = "Match coronal brain slab photographs to the T1 MRI they were cut from"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "opencv-python",
    "scikit-image",
    "torch",
    "kornia",
]

[project.optional-dependencies]
wmh = ["wmh_seg>=1.6"]
ppt = ["python-pptx"]

[project.scripts]
histomatch = "histomatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
